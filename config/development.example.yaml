# 配置优先级为非空进程环境变量、当前 YAML、内置默认值
# 环境变量按 SHIFTORY_<分组>_<字段> 命名，例如 ai.model 对应 SHIFTORY_AI_MODEL
# 图片识别服务，启用时需要提供模型和密钥
ai:
  api_key: ""
  base_url: ""
  enabled: false
  model: ""
  request_timeout: 90s
# JWT 签发信息与密钥文件路径
jwt:
  audience: shiftory-web
  issuer: shiftory-local
  private_key_file: ./var/jwt-private.pem
  public_key_file: ./var/jwt-public.pem
# 日志等级与输出格式
log:
  format: text
  level: debug
# 数据库连接参数，字符集与时区由程序固定为 utf8mb4 和 UTC
mysql:
  database: shiftory
  host: 127.0.0.1
  password: "123456"
  port: 3306
  user: root
# 服务监听端口、公开来源和前端静态文件目录
server:
  port: 8080
  public_origin: http://localhost:5173
  web_dir: ../shiftory-web/dist
# 上传文件存储位置
storage:
  upload_dir: ./uploads
# 图片任务的并发、租约与轮询设置
worker:
  id: shiftory-worker-local
  lease: 3m
  max_concurrency: 2
  poll_interval: 5s
