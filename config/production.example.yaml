# 复制为 production.yaml 后按部署环境填写，该文件会被 Git 忽略
# 配置优先级为非空 SHIFTORY_<大写键名> 环境变量、YAML、内置默认值
# 启动模式由 --env 选择，未指定时默认为 production
# 相对路径以进程工作目录为基准，不以本文件所在目录为基准
# systemd 部署应使用绝对路径，示例文件不得填写真实凭据
log_level: "info"
log_format: "json"
http_addr: ":8080"
database_dsn: "root:123456@tcp(127.0.0.1:3306)/shiftory?charset=utf8mb4&parseTime=true&loc=UTC"
upload_dir: "./uploads"
web_dir: "../shiftory-web/dist"
public_origin: "http://localhost:8080"
jwt_issuer: "shiftory-local"
jwt_audience: "shiftory-web"
jwt_private_key_file: "./var/jwt-private.pem"
jwt_public_key_file: "./var/jwt-public.pem"
ai_model: ""
ai_base_url: ""
ai_api_key: ""
ai_enabled: false
ai_request_timeout: "90s"
worker_id: "shiftory-worker-local"
worker_poll_interval: "5s"
worker_lease: "3m"
worker_max_concurrency: 2
